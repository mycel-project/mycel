name: CI
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
        
  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup config
        run: cp config.json.example config.json
      - run: pip install -r requirements.txt
      - run: pytest tests/

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: myceladmin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mycel
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup config
        run: cp config.json.example config.json
      - run: pip install -r requirements.txt
      - run: pytest tests/
        env:
          TEST_DATABASE_URL: postgresql://myceladmin:password@localhost/mycel
