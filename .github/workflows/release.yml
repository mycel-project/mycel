name: Release Backend
on:
  push:
    tags:
      - 'v*'
      
permissions:
  contents: write
  
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update VERSION file
        run: echo "${{ github.ref_name }}" | sed 's/^v//' > VERSION

      - name: Update VERSION and re-tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
            
          git fetch origin
            
          COMMIT=$(git rev-list -n 1 ${{ github.ref_name }})
          BRANCH=$(git branch -r --contains $COMMIT | grep -v 'HEAD' | head -n 1 | sed 's|.*origin/||' | xargs)
            
          if [ -z "$BRANCH" ]; then
          BRANCH="main"
          fi
            
          echo "Pushing to branch: $BRANCH"
            
          git checkout $BRANCH
          git pull origin $BRANCH
            
          git add VERSION
          git commit -m "chore: bump VERSION to ${{ github.ref_name }}"
            
          git tag -f ${{ github.ref_name }}
            
          git push origin $BRANCH
          git push origin ${{ github.ref_name }} --force
            
      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_NO_V=$(echo "$VERSION" | sed 's/^v//')
          NOTES=$(awk "/^## ($VERSION|$VERSION_NO_V)/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md | tr -d '\r')
          if [ -z "$NOTES" ]; then
            NOTES="No release notes found for $VERSION"
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.notes }}
          token: ${{ secrets.GITHUB_TOKEN }}
