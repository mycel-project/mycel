name: Release Backend

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  check-prerelease:
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
    steps:
      - name: Check prerelease
        id: check
        run: |
          if [[ "${{ github.ref_name }}" == *"-beta"* ]] || [[ "${{ github.ref_name }}" == *"-rc"* ]] || [[ "${{ github.ref_name }}" == *"-alpha"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi
          
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: [check-prerelease, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_NO_V=$(echo "$VERSION" | sed 's/^v//')
          NOTES=$(awk "/^## ($VERSION|$VERSION_NO_V)/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md | tr -d '\r')
          if [ -z "$NOTES" ]; then
            NOTES="No release notes found for $VERSION"
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ needs.check-prerelease.outputs.is_prerelease }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.notes }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup config
        run: cp config.json.example config.json

      - name: Generate openapi.json
        run: |
          pip install -r requirements.txt
          python -c "
          import json
          from src.interfaces.rest.rest import Rest
          from src.core.app_infos import AppInfos
          app_infos=AppInfos()
          rest = Rest(app_infos=app_infos)
          with open('openapi.json', 'w') as f:
            json.dump(rest.app.openapi(), f, indent=2)
          "
          
      - name: Push to mycel-openapi repo # all releases (stable + prerelease)
        uses: dmnemec/copy_file_to_another_repo_action@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.DOCS_DEPLOY_TOKEN }}
        with:
          source_file: 'openapi.json'
          destination_repo: 'mycel-project/mycel-openapi'
          destination_folder: '.'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          user_name: 'github-actions[bot]'
          commit_message: 'contract: update to ${{ github.ref_name }}'
          
      - name: Tag mycel-openapi repo 
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DOCS_DEPLOY_TOKEN }}
          script: |
            await new Promise(r => setTimeout(r, 2000));
            const ref = await github.rest.git.getRef({
              owner: 'mycel-project',
              repo: 'mycel-openapi',
              ref: 'heads/main'
            });
            try {
              await github.rest.git.createRef({
                owner: 'mycel-project',
                repo: 'mycel-openapi',
                ref: 'refs/tags/${{ github.ref_name }}',
                sha: ref.data.object.sha
              });
            } catch (error) {
              if (error.status === 422) {
                console.log("Tag already exists on remote repo.");
              } else {
                throw error;
              }
            }

      - name: Push to docs repo # only stable releases
        if: needs.check-prerelease.outputs.is_prerelease == 'false'
        uses: dmnemec/copy_file_to_another_repo_action@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.DOCS_DEPLOY_TOKEN }}
        with:
          source_file: 'openapi.json'
          destination_repo: 'mycel-project/mycel-project.github.io'
          destination_folder: 'mycel-docs/docs/reference'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          user_name: 'github-actions[bot]'
          commit_message: 'chore: sync openapi.json to docs (${{ github.ref_name }})'
